<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>📊 Daily KPI Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<header>

    <h1>📊 Daily KPI Dashboard</h1>

    <p class="version">
        Version 2.1.1
    </p>

</header>

<!-- ====================================== -->
<!-- KPI設定 -->
<!-- ====================================== -->

<section class="card">

    <h2>⚙ KPI設定</h2>

    <table class="kpiTable">

        <tr>
            <th>項目名</th>
            <th>目標率 (%)</th>
        </tr>

        <tr>
            <td>カケホ</td>
            <td>
                <input
                    id="rate0"
                    type="number"
                    value="35">
            </td>
        </tr>

        <tr>
            <td>最強保護</td>
            <td>
                <input
                    id="rate1"
                    type="number"
                    value="30">
            </td>
        </tr>

        <tr>
            <td>U-NEXT</td>
            <td>
                <input
                    id="rate2"
                    type="number"
                    value="13">
            </td>
        </tr>

    </table>

    <label class="saveOption">

        <input
            id="saveSetting"
            type="checkbox"
            checked>

        この端末に設定を保存する

    </label>

    <button
        id="saveBtn">

        💾 KPI設定を保存

    </button>

    <button
        id="resetBtn">

        🔄 初期設定へ戻す

    </button>

</section>

<!-- ====================================== -->
<!-- 入力 -->
<!-- ====================================== -->

<section class="card">

    <h2>📝 入力</h2>

    <label>

        集計時刻

    </label>

    <input
        id="reportTime"
        type="time"
        value="16:00">

    <textarea
        id="input"
        placeholder="ここへ業務システムの文章を貼り付けてください"></textarea>

    <button
        id="calcBtn">

        📊 計算

    </button>

    <button
        id="clearBtn">

        🗑 入力をクリア

    </button>

</section>

<!-- メッセージ -->

<div
    id="message">

</div>

<!-- ====================================== -->
<!-- 出力① -->
<!-- ====================================== -->

<section class="card">

    <h2>📈 単日付帯率</h2>

    <div
        id="output1"
        class="output">

        計算待ち...

    </div>

    <button
        id="copyOutput1"
        class="copyBtn">

        📋 単日付帯率をコピー

    </button>

</section>

<!-- ====================================== -->
<!-- 出力② -->
<!-- ====================================== -->

<section class="card">

    <h2>📊 単日注力KPI</h2>

    <div
        id="output2"
        class="output">

        計算待ち...

    </div>

    <button
        id="copyOutput2"
        class="copyBtn">

        📋 単日注力KPIをコピー

    </button>

</section>

<footer>

    Daily KPI Dashboard

    <br>

    Version 2.1.1

    <br>

    Created by kame2174

</footer>

<script src="script.js">

</script>

</body>

</html>
